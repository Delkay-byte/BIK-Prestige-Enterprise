# Render Deployment Blueprint — BIK Prestige Enterprise
# https://render.com/docs/blueprint-spec

services:
  # Next.js Web Application
  - type: web
    name: bik-prestige
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: PILOT
      - key: DATABASE_URL
        fromDatabase:
          name: bik-prestige-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # PostgreSQL Database
  - type: postgresql
    name: bik-prestige-db
    plan: free
    databaseName: bik_pilot
    ipAllowList: []
