# Render Deployment Blueprint — BIK Prestige Enterprise
# https://render.com/docs/blueprint-spec
#
# NOTE: PostgreSQL database must be created manually on Render first.
# Then set DATABASE_URL in the web service environment variables.

services:
  # Next.js Web Application
  - type: web
    name: bik-prestige
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: PILOT
      - key: JWT_SECRET
        generateValue: true
